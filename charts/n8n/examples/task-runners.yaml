# Task Runners with Queue Mode
# This example demonstrates enabling task runner sidecars for external code execution
# Task runners handle JavaScript and Python execution in isolated sidecar containers
#
# Architecture:
#   - The n8n container runs a task broker on port 5679
#   - A runner sidecar container connects to the broker over localhost
#   - Worker pods get a runner sidecar (main pods do not; queue mode offloads execution to workers)
#
# Prerequisites:
#   - External PostgreSQL and Redis (queue mode)
#   - A shared auth token secret for runner ↔ broker communication

queueMode:
  enabled: true
  workerReplicaCount: 3
  workerConcurrency: 10

# Task runner sidecars are on by default; enabled is set here to show the key.
# In queue mode they run on worker pods, because main offloads executions to
# workers.
taskRunners:
  enabled: true

  # The runner and broker authenticate with N8N_RUNNERS_AUTH_TOKEN from the
  # core Secret (secretRefs.existingSecret below). To keep the token in a
  # Secret of its own instead:
  # authToken:
  #   existingSecret: "n8n-runner-token"
  #   existingSecretKey: "auth-token"

  # Broker runs inside the n8n container
  broker:
    port: 5679

  # Launcher settings
  launcher:
    logLevel: info
    autoShutdownTimeout: 15

  # Resource limits for runner sidecar (tune based on workflow complexity)
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Optional: mount a custom config to allowlist additional npm packages
  # customConfig:
  #   enabled: true
  #   configMapName: "n8n-runner-config"
  #   configMapKey: "n8n-task-runners.json"

# External database
database:
  type: postgresdb
  host: "your-postgres-host.com"
  port: 5432
  database: n8n
  schema: "public"
  user: n8n
  passwordSecret:
    name: "n8n-db-secret"
    key: "password"

# External Redis
redis:
  enabled: true
  host: "your-redis-host.com"
  port: 6379

# Core secrets
# The core Secret also holds N8N_RUNNERS_AUTH_TOKEN, the task-runner auth token.
secretRefs:
  existingSecret: "n8n-core-secrets"

# Resource limits for n8n containers
resources:
  main:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  worker:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
