# Standalone mode — single n8n pod with SQLite, no external dependencies.
# Suitable for development, testing, or small-scale production use.
# Data is stored in a PersistentVolumeClaim; no PostgreSQL or Redis required.

queueMode:
  enabled: false

database:
  type: sqlite

redis:
  enabled: false

persistence:
  enabled: true
  size: 5Gi

# You must still provide an encryption key for credential storage, and a
# token for the task-runner sidecar. Create a secret:
#   kubectl create secret generic n8n-secrets \
#     --from-literal=N8N_ENCRYPTION_KEY=$(openssl rand -hex 32) \
#     --from-literal=N8N_RUNNERS_AUTH_TOKEN=$(openssl rand -base64 32)
secretRefs:
  existingSecret: "n8n-secrets"
