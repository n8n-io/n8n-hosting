# Multi-main and Queue Mode Configuration
# This example demonstrates multi-main setup with queue mode (requires Enterprise license)
# Shows basic multi-main configuration without cloud-specific features

# Multi-main for high availability (Enterprise feature)
multiMain:
  enabled: true
  replicas: 3

queueMode:
  enabled: true
  workerReplicaCount: 10

webhookProcessor:
  enabled: true
  replicaCount: 5
  disableProductionWebhooksOnMainProcess: true

hpa:
  main:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  worker:
    enabled: true
    minReplicas: 10
    maxReplicas: 100
    targetCPUUtilizationPercentage: 70
  webhookProcessor:
    enabled: true
    minReplicas: 5
    maxReplicas: 50
    targetCPUUtilizationPercentage: 65

# External database (production PostgreSQL)
database:
  type: postgresdb
  host: "your-postgres-host.com"
  port: 5432
  database: n8n_enterprise
  schema: "public"                    # PostgreSQL schema name
  user: n8n
  passwordSecret:
    name: "n8n-enterprise-db-secret"
    key: "password"
  ssl:
    enabled: true
    rejectUnauthorized: true           # Set to false only for self-signed certs (not recommended for production), instead consider providing the server's CA below
    # If the server's CA is not publicly trusted (Amazon RDS, for example), put
    # the provider's CA bundle in a Secret and reference it:
    #   kubectl create secret generic postgres-ca --from-file=ca.crt=global-bundle.pem
    # existingSecret:
    #   name: postgres-ca
    #   caKey: ca.crt

# External Redis (production Redis)
redis:
  enabled: true
  host: "your-redis-host.com"
  port: 6379

# Enterprise S3 storage
s3:
  enabled: true
  bucket:
    name: "n8n-enterprise-storage"
    region: "us-east-1"
  auth:
    autoDetect: true  # AWS SDK credential chain, here IRSA on EKS

# Service account with enterprise IAM role
serviceAccount:
  create: true
  name: n8n-enterprise
  annotations:
    # IRSA on EKS. Remove it if you use Pod Identity or access keys.
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/n8n-enterprise-role"

# n8n Enterprise License Configuration
license:
  enabled: true
  # Enterprise license activation key (get from n8n customer portal)
  activationKey: "your-enterprise-license-key-here"

# Service configuration with session affinity
service:
  type: ClusterIP
  port: 5678
  sessionAffinity:
    enabled: true
    timeoutSeconds: 14400  # 4 hours

# Enterprise resource allocation
resources:
  main:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  worker:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  webhookProcessor:
    requests:
      memory: "512Mi"
      cpu: "300m"
    limits:
      memory: "1Gi"
      cpu: "800m"

# Enterprise configuration
config:
  timezone: UTC

env:
  shared:
    # Security settings
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true

    # Enterprise logging
    N8N_LOG_LEVEL: info
    N8N_LOG_OUTPUT: json  # Structured logging for enterprise

    # Enterprise features
    N8N_ENTERPRISE_LICENSE_ENABLED: true

# Advanced execution settings
executions:
  concurrency:
    # In queue mode n8n uses this as each worker's concurrency.
    productionLimit: 100
  timeout: 7200  # 2 hours

# Core secrets
# The core Secret also holds N8N_RUNNERS_AUTH_TOKEN, the task-runner auth token.
secretRefs:
  existingSecret: "n8n-enterprise-secrets"

# Pod disruption budget for high availability
pdb:
  enabled: true
  minAvailable: 2

# Network policies for enterprise security. These ingress rules replace the
# chart's, so only the ingress controller's namespace and the release's own
# pods, such as the helm test pod, reach n8n. The pod rule matches a release
# named n8n. Egress is left empty, which allows all egress.
networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
      ports:
        - protocol: TCP
          port: 5678
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: n8n
              app.kubernetes.io/instance: n8n
      ports:
        - protocol: TCP
          port: 5678
