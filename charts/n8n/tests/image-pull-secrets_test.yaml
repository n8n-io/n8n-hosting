# imagePullSecrets is set once and applies at pod level, so it covers every
# container in the pod: n8n, the task-runner sidecar and extraInitContainers.
suite: 'image: pull secrets'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/tests/test-connection.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  database.type: postgresdb
  database.useExternal: true
  database.host: postgres.example.com
  queueMode.enabled: true
  webhookProcessor.enabled: true
tests:
  - it: renders no imagePullSecrets by default
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: templates/deployment-main.yaml
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: templates/deployment-worker.yaml
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: templates/deployment-webhook-processor.yaml
      - notExists:
          path: spec.imagePullSecrets
        template: templates/tests/test-connection.yaml

  - it: sets imagePullSecrets on every n8n pod
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    set:
      imagePullSecrets:
        - name: registry-a
        - name: registry-b
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-a
            - name: registry-b

  - it: sets imagePullSecrets on the test pod
    template: templates/tests/test-connection.yaml
    set:
      imagePullSecrets:
        - name: registry-a
    asserts:
      - equal:
          path: spec.imagePullSecrets
          value:
            - name: registry-a

  - it: rejects an entry without a name
    template: templates/deployment-main.yaml
    set:
      imagePullSecrets:
        - {}
    asserts:
      - failedTemplate:
          errorPattern: 'imagePullSecrets/0.*name'

  - it: rejects a misspelt key
    template: templates/deployment-main.yaml
    set:
      imagePullSecrets:
        - name: registry-a
          nmae: registry-b
    asserts:
      - failedTemplate:
          errorPattern: 'imagePullSecrets/0.*nmae'
