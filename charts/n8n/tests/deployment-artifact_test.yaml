suite: 'render: deployment artifact'
templates:
  - templates/configmap.yaml
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/secrets.yaml
chart:
  version: 9.9.9
set:
  secretRefs.existingSecret: n8n-core-secrets
  queueMode.enabled: true
  webhookProcessor.enabled: true
  database.type: postgresdb
  database.useExternal: true
  database.host: postgres.acme.example.com
  database.passwordSecret.name: n8n-db
  redis.host: redis.acme.example.com
tests:
  - it: names the chart and its version
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    asserts:
      - equal:
          path: data.N8N_DEPLOYMENT_ARTIFACT
          value: helm-chart/9.9.9

  - it: reaches every component through the shared ConfigMap
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-n8n

  - it: lets a wrapping chart report as itself
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    set:
      config.deploymentArtifact: azure-marketplace/1.0.0
    asserts:
      - equal:
          path: data.N8N_DEPLOYMENT_ARTIFACT
          value: azure-marketplace/1.0.0
