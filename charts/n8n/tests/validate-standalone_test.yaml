suite: 'validate: standalone mode'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts standalone with persistence
    template: templates/deployment-main.yaml
    set:
      queueMode.enabled: false
      database.type: sqlite
      persistence.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: requires persistence for sqlite
    template: templates/deployment-main.yaml
    set:
      queueMode.enabled: false
      database.type: sqlite
      persistence.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'persistence.enabled must be true when database.type=sqlite. SQLite keeps its data on the PersistentVolumeClaim.'

  - it: rejects multi-main outside queue mode
    template: templates/deployment-main.yaml
    set:
      queueMode.enabled: false
      multiMain.enabled: true
      multiMain.replicas: 2
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/queueMode/enabled': value must be true"

  - it: rejects webhook processors outside queue mode
    template: templates/deployment-main.yaml
    set:
      queueMode.enabled: false
      webhookProcessor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: 'webhookProcessor.enabled=true requires queueMode.enabled=true'

  - it: rejects multi-main with sqlite
    template: templates/deployment-main.yaml
    set:
      database.type: sqlite
      multiMain.enabled: true
      multiMain.replicas: 2
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/multiMain/enabled': value must be false"
