suite: 'validate: multi-main'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts multi-main with two replicas
    template: templates/deployment-main.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 2
      license.enabled: true
      license.existingSecret.name: n8n-license
    asserts:
      - notFailedTemplate: {}

  - it: renders the multi-main env with a licence
    template: templates/configmap.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 2
      license.enabled: true
      license.existingSecret.name: n8n-license
    asserts:
      - equal:
          path: data.N8N_MULTI_MAIN_SETUP_ENABLED
          value: "true"

  - it: accepts multi-main with license.enabled and no key in values
    template: templates/deployment-main.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 2
      license.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects multi-main without a licence
    template: templates/deployment-main.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 2
    asserts:
      - failedTemplate:
          errorMessage: 'multiMain.enabled=true requires license.enabled=true. Multi-main is an n8n Enterprise feature. Set license.activationKey or license.existingSecret.name, or set license.enabled=true alone if the licence reaches n8n another way.'

  - it: rejects multi-main with one replica
    template: templates/deployment-main.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 1
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/multiMain/replicas': minimum"

  - it: accepts a main HPA with multi-main
    template: templates/deployment-main.yaml
    set:
      multiMain.enabled: true
      multiMain.replicas: 2
      license.enabled: true
      hpa.main.enabled: true
      hpa.main.minReplicas: 2
      hpa.main.maxReplicas: 5
    asserts:
      - notFailedTemplate: {}

  - it: accepts a main HPA capped at one replica without multi-main
    template: templates/deployment-main.yaml
    set:
      hpa.main.enabled: true
      hpa.main.minReplicas: 1
      hpa.main.maxReplicas: 1
    asserts:
      - notFailedTemplate: {}

  - it: rejects a main HPA that scales past one replica without multi-main
    template: templates/deployment-main.yaml
    set:
      hpa.main.enabled: true
      hpa.main.maxReplicas: 2
    asserts:
      - failedTemplate:
          errorMessage: 'hpa.main.enabled=true with hpa.main.maxReplicas > 1 requires multiMain.enabled=true. Without multi-main, each extra main runs schedules and triggers on its own. Set multiMain.enabled=true, or set hpa.main.enabled=false.'

  - it: accepts more than one main replica with multi-main
    template: templates/deployment-main.yaml
    set:
      replicaCount: 3
      multiMain.enabled: true
      multiMain.replicas: 2
      license.enabled: true
    asserts:
      - notFailedTemplate: {}

  - it: rejects more than one main replica without multi-main
    template: templates/deployment-main.yaml
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorMessage: 'replicaCount > 1 requires multiMain.enabled=true. Without multi-main, each extra main runs schedules and triggers on its own. Set multiMain.enabled=true, or set replicaCount to 1.'
