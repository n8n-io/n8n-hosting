suite: 'render: S3 env'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  webhookProcessor.enabled: true
  s3.enabled: true
  s3.storage.mode: s3
  s3.bucket.name: n8n-data
  s3.bucket.region: eu-west-1
  s3.auth.autoDetect: true
  serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
tests:
  - it: sets the binary data mode and not the available modes in the shared ConfigMap
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    asserts:
      - equal:
          path: data.N8N_DEFAULT_BINARY_DATA_MODE
          value: s3
      - notExists:
          path: data.N8N_AVAILABLE_BINARY_DATA_MODES

  - it: loads the shared ConfigMap on every n8n container
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-n8n

  # The schema allows unknown keys under s3.storage, so values files written
  # for older chart versions keep rendering.
  - it: ignores s3.storage.availableModes
    template: templates/configmap.yaml
    set:
      s3.storage.availableModes: filesystem,s3
    asserts:
      - notFailedTemplate: {}
      - notExists:
          path: data.N8N_AVAILABLE_BINARY_DATA_MODES
