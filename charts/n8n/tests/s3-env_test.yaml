suite: 'render: S3 env'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  webhookProcessor.enabled: true
  s3.enabled: true
  s3.bucket.name: n8n-data
  s3.bucket.region: eu-west-1
  s3.auth.autoDetect: true
  serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
tests:
  - it: stores binary data in S3 by default, without setting the available modes
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    asserts:
      - equal:
          path: data.N8N_DEFAULT_BINARY_DATA_MODE
          value: s3
      - notExists:
          path: data.N8N_AVAILABLE_BINARY_DATA_MODES

  - it: loads the shared ConfigMap on every n8n container
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-n8n

  - it: keeps an explicit s3 mode
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    set:
      s3.storage.mode: s3
    asserts:
      - equal:
          path: data.N8N_DEFAULT_BINARY_DATA_MODE
          value: s3

  # Keeps the bucket for execution data while binary data goes elsewhere.
  - it: lets chartEnvOverrides replace the S3 mode
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    set:
      chartEnvOverrides.shared.N8N_DEFAULT_BINARY_DATA_MODE: database
    asserts:
      - equal:
          path: data.N8N_DEFAULT_BINARY_DATA_MODE
          value: database

  # Without S3 the chart leaves the mode to n8n, which picks one per topology.
  - it: sets no binary data mode when S3 is off
    template: templates/configmap.yaml
    set:
      s3.enabled: false
    asserts:
      - notExists:
          path: data.N8N_DEFAULT_BINARY_DATA_MODE

  # The schema allows unknown keys under s3.storage, so values files written
  # for older chart versions keep rendering.
  - it: ignores s3.storage.availableModes
    template: templates/configmap.yaml
    set:
      s3.storage.availableModes: filesystem,s3
    asserts:
      - notFailedTemplate: {}
      - notExists:
          path: data.N8N_AVAILABLE_BINARY_DATA_MODES
