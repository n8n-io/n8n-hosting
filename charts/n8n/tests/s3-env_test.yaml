suite: 'render: S3 env'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  webhookProcessor.enabled: true
  s3.enabled: true
  s3.storage.mode: s3
  s3.bucket.name: n8n-data
  s3.bucket.region: eu-west-1
  s3.auth.autoDetect: true
  serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
tests:
  - it: sets the binary data mode and not the available modes on main
    template: templates/deployment-main.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_DEFAULT_BINARY_DATA_MODE
            value: s3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_AVAILABLE_BINARY_DATA_MODES
          any: true

  - it: sets the binary data mode and not the available modes on workers
    template: templates/deployment-worker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_DEFAULT_BINARY_DATA_MODE
            value: s3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_AVAILABLE_BINARY_DATA_MODES
          any: true

  - it: sets the binary data mode and not the available modes on webhook processors
    template: templates/deployment-webhook-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_DEFAULT_BINARY_DATA_MODE
            value: s3
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_AVAILABLE_BINARY_DATA_MODES
          any: true

  # The schema allows unknown keys under s3.storage, so values files written
  # for older chart versions keep rendering.
  - it: ignores s3.storage.availableModes
    template: templates/deployment-main.yaml
    set:
      s3.storage.availableModes: filesystem,s3
    asserts:
      - notFailedTemplate: {}
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_AVAILABLE_BINARY_DATA_MODES
          any: true
