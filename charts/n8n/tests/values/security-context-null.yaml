# A null removes a field the shared block sets. Pods: the pinned IDs on
# main, as on OpenShift. Containers: one field on main, and every field on
# worker.
podSecurityContext:
  main:
    fsGroup: null
    runAsUser: null
    runAsGroup: null
containerSecurityContext:
  main:
    allowPrivilegeEscalation: null
  worker:
    allowPrivilegeEscalation: null
    capabilities: null
