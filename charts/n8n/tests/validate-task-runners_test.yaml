suite: 'validate: task runners'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts external task runners
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.mode: external
    asserts:
      - notFailedTemplate: {}

  - it: rejects any mode other than external
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.mode: internal
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/taskRunners/mode': value must be 'external'"

  - it: accepts a numeric launcher health check port
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.extraEnv:
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: "5690"
    asserts:
      - notFailedTemplate: {}

  - it: rejects a launcher health check port that is not a number
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.extraEnv:
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: health
    asserts:
      - failedTemplate:
          errorMessage: 'N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT in taskRunners.extraEnv must be a port number from 1 to 65535, got "health". The sidecar''s liveness probe uses it.'

  - it: rejects a launcher health check port out of range
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.extraEnv:
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: "70000"
    asserts:
      - failedTemplate:
          errorMessage: 'N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT in taskRunners.extraEnv must be a port number from 1 to 65535, got "70000". The sidecar''s liveness probe uses it.'

  - it: skips the port check when the liveness probe is disabled
    template: templates/deployment-main.yaml
    set:
      taskRunners.enabled: true
      taskRunners.probes.liveness.enabled: false
      taskRunners.extraEnv:
        - name: N8N_RUNNERS_LAUNCHER_HEALTH_CHECK_PORT
          value: health
    asserts:
      - notFailedTemplate: {}
