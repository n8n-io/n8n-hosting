suite: 'validate: persistence'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  taskRunners.authToken.existingSecret: n8n-runner-token
  persistence.enabled: true
tests:
  - it: rejects persistence.annotations with existingClaim
    template: templates/deployment-main.yaml
    set:
      persistence.existingClaim: my-n8n-data
      persistence.annotations:
        backup.example.com/schedule: daily
    asserts:
      - failedTemplate:
          errorMessage: "persistence.annotations has no effect with persistence.existingClaim, because the chart does not create that PVC. Annotate my-n8n-data directly, or remove persistence.annotations."

  - it: accepts existingClaim without persistence.annotations
    template: templates/deployment-main.yaml
    set:
      persistence.existingClaim: my-n8n-data
    asserts:
      - notFailedTemplate: {}
