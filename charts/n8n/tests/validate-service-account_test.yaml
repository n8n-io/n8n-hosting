suite: 'validate: service account'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts with a pre-existing ServiceAccount
    template: templates/deployment-main.yaml
    set:
      serviceAccount.create: false
      serviceAccount.name: my-service-account
    asserts:
      - notFailedTemplate: {}

  - it: requires a name when the chart does not create the ServiceAccount
    template: templates/deployment-main.yaml
    set:
      serviceAccount.create: false
    asserts:
      - failedTemplate:
          errorMessage: 'serviceAccount.create=false but serviceAccount.name is still the chart default "n8n". Set serviceAccount.name to your pre-existing ServiceAccount, or to "" to use the namespace''s default ServiceAccount.'
