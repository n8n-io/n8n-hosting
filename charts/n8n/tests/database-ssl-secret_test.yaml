# database.ssl.existingSecret names a Secret the user owns and the keys inside
# it. Each key that is set becomes one secretKeyRef on every n8n component, so
# the TLS material never passes through values or the ConfigMap.
suite: 'database: SSL from an existing Secret'
templates:
  - templates/configmap.yaml
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  database.type: postgresdb
  database.useExternal: true
  database.host: postgres.example.com
  database.ssl.enabled: true
  queueMode.enabled: true
  webhookProcessor.enabled: true
tests:
  - it: passes the CA from the Secret to every n8n container
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.caKey: ca.crt
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_CA
            valueFrom:
              secretKeyRef:
                name: postgres-tls
                key: ca.crt
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_CERT
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_KEY
          any: true

  - it: renders a numeric Secret name and key as strings
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.name: "123"
      database.ssl.existingSecret.caKey: "1"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_CA
            valueFrom:
              secretKeyRef:
                name: "123"
                key: "1"

  - it: passes the client cert and key from the Secret to every n8n container
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.certKey: tls.crt
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_CERT
            valueFrom:
              secretKeyRef:
                name: postgres-tls
                key: tls.crt
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_KEY
            valueFrom:
              secretKeyRef:
                name: postgres-tls
                key: tls.key
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DB_POSTGRESDB_SSL_CA
          any: true

  - it: passes all three from the Secret and keeps them out of the ConfigMap
    template: templates/configmap.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.caKey: ca.crt
      database.ssl.existingSecret.certKey: tls.crt
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - equal:
          path: data.DB_POSTGRESDB_SSL_ENABLED
          value: "true"
      - notExists:
          path: data.DB_POSTGRESDB_SSL_CA
      - notExists:
          path: data.DB_POSTGRESDB_SSL_CERT
      - notExists:
          path: data.DB_POSTGRESDB_SSL_KEY

  - it: accepts an inline CA alongside a client cert and key from the Secret
    template: templates/deployment-main.yaml
    set:
      database.ssl.ca: "-----BEGIN CERTIFICATE-----"
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.certKey: tls.crt
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - notFailedTemplate: {}

  - it: requires at least one key when the Secret is named
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.existingSecret.name is set but no key is. Set at least one of caKey, certKey or keyKey to a key your Secret holds, for example caKey: ca.crt.'

  - it: requires the Secret name when a key is set
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.caKey: ca.crt
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.existingSecret has a key set but no name. Set database.ssl.existingSecret.name to the Secret that holds the keys.'

  - it: accepts an inline client cert with its key from the Secret
    template: templates/deployment-main.yaml
    set:
      database.ssl.cert: "-----BEGIN CERTIFICATE-----"
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - notFailedTemplate: {}

  - it: requires keyKey with certKey
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.certKey: tls.crt
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.existingSecret.certKey is set but keyKey is not. A client certificate is only used with its private key.'

  - it: requires a client cert with keyKey
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.existingSecret.keyKey is set but there is no client certificate. Set database.ssl.existingSecret.certKey, or database.ssl.cert.'

  - it: requires SSL to be enabled when the Secret is set
    template: templates/deployment-main.yaml
    set:
      database.ssl.enabled: false
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.caKey: ca.crt
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.existingSecret is set but database.ssl.enabled is false. Set database.ssl.enabled: true, or remove database.ssl.existingSecret.'

  - it: rejects an inline CA and a CA from the Secret together
    template: templates/deployment-main.yaml
    set:
      database.ssl.ca: "-----BEGIN CERTIFICATE-----"
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.caKey: ca.crt
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.ca and database.ssl.existingSecret.caKey are mutually exclusive. Use one or the other.'

  - it: rejects an inline cert and a cert from the Secret together
    template: templates/deployment-main.yaml
    set:
      database.ssl.cert: "-----BEGIN CERTIFICATE-----"
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.certKey: tls.crt
      database.ssl.existingSecret.keyKey: tls.key
    asserts:
      - failedTemplate:
          errorMessage: 'database.ssl.cert and database.ssl.existingSecret.certKey are mutually exclusive. Use one or the other.'

  - it: rejects an unknown key inside existingSecret
    template: templates/deployment-main.yaml
    set:
      database.ssl.existingSecret.name: postgres-tls
      database.ssl.existingSecret.caKeys: ca.crt
    asserts:
      - failedTemplate:
          errorPattern: 'additional properties .caKeys. not allowed'
