# Workers probe the HTTP server n8n starts when QUEUE_HEALTH_CHECK_ACTIVE is
# set. /healthz/readiness answers 503 until the worker has its database,
# migrations and Redis, so a worker without them stops reporting Ready.
suite: 'worker: probes'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  taskRunners.authToken.existingSecret: n8n-runner-token
tests:
  - it: enables the queue health endpoint on the worker by default
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-worker
    asserts:
      - equal:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE
          value: "true"
      - equal:
          path: data.QUEUE_HEALTH_CHECK_PORT
          value: "5678"

  - it: leaves the health endpoint off the main pod, which never reads it
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-main
    asserts:
      - notExists:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE

  - it: probes the health endpoint over HTTP by default
    template: templates/deployment-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /healthz
              port: 5678
            failureThreshold: 30
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: 5678
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /healthz/readiness
            port: 5678
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.exec
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec

  - it: probes the port set in redis.healthCheck.port
    template: templates/deployment-worker.yaml
    set:
      redis.healthCheck.port: 5690
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 5690
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 5690
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 5690

  - it: takes probe paths and timings from values
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness:
        path: /custom/healthz
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 4
      probes.worker.readiness:
        path: /custom/healthz/readiness
        initialDelaySeconds: 5
        periodSeconds: 6
        timeoutSeconds: 7
        failureThreshold: 8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /custom/healthz
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 4
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /custom/healthz/readiness
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 6
            timeoutSeconds: 7
            failureThreshold: 8

  - it: takes the startup probe path and budget from values
    template: templates/deployment-worker.yaml
    set:
      probes.worker.startup:
        path: /custom/healthz
        periodSeconds: 5
        failureThreshold: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /custom/healthz
              port: 5678
            failureThreshold: 60
            periodSeconds: 5

  - it: drops the startup probe when it is disabled
    template: templates/deployment-worker.yaml
    set:
      probes.worker.startup.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet

  - it: drops a probe that is disabled
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.enabled: false
      probes.worker.readiness.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: runs an exec probe when type is exec
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.type: exec
      probes.worker.liveness.command: ["/bin/true"]
      probes.worker.readiness.type: exec
      probes.worker.readiness.command: ["/bin/true"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/true"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/true"]
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet

  - it: falls back to the process check when the health endpoint is off
    template: templates/deployment-worker.yaml
    set:
      redis.healthCheck.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]

  - it: leaves the health env out of the worker ConfigMap when the endpoint is off
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-worker
    set:
      redis.healthCheck.enabled: false
    asserts:
      - notExists:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE

  - it: keeps rendering a values file copied from an older chart
    template: templates/deployment-worker.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness:
        type: exec
        command: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]
      probes.worker.readiness:
        type: exec
        command: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]

  - it: runs the process check for an exec probe with no command
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.type: exec
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/sh", "-c", "pgrep -f 'n8n worker' > /dev/null"]
      - exists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: runs a command set without a type as an exec probe
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.command: ["/bin/true"]
      probes.worker.readiness.command: ["/bin/false"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/true"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/false"]
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: rejects an HTTP liveness probe with the health endpoint off
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness.type: httpGet
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.liveness.type=httpGet requires redis.healthCheck.enabled=true, which starts the worker health endpoint. Set redis.healthCheck.enabled=true, or remove probes.worker.liveness.type to let the chart choose.'

  - it: rejects an HTTP readiness probe with the health endpoint off
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.readiness.type: httpGet
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.readiness.type=httpGet requires redis.healthCheck.enabled=true, which starts the worker health endpoint. Set redis.healthCheck.enabled=true, or remove probes.worker.readiness.type to let the chart choose.'

  - it: accepts a disabled HTTP probe with the health endpoint off
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness:
        enabled: false
        type: httpGet
    asserts:
      - notFailedTemplate: {}

  - it: skips the probe checks when there are no worker pods
    template: templates/deployment-main.yaml
    set:
      queueMode.workerReplicaCount: 0
      redis.healthCheck.enabled: false
      probes.worker.liveness.type: httpGet
    asserts:
      - notFailedTemplate: {}
