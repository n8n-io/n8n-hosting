# Workers probe the HTTP server n8n starts when QUEUE_HEALTH_CHECK_ACTIVE is
# set. /healthz/readiness answers 503 until the worker has its database,
# migrations and Redis, so a worker without them stops reporting Ready.
suite: 'worker: probes'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: enables the queue health endpoint on the worker by default
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-worker
    asserts:
      - equal:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE
          value: "true"
      - equal:
          path: data.QUEUE_HEALTH_CHECK_PORT
          value: "5678"

  - it: leaves the health endpoint off the main pod, which never reads it
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-main
    asserts:
      - notExists:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE

  - it: probes the health endpoint over HTTP by default
    template: templates/deployment-worker.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /healthz
              port: 5678
            failureThreshold: 30
            periodSeconds: 10
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
          value:
            path: /healthz
            port: 5678
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
          value:
            path: /healthz/readiness
            port: 5678
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.exec
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.exec

  - it: probes the port set in redis.healthCheck.port
    template: templates/deployment-worker.yaml
    set:
      redis.healthCheck.port: 5690
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 5690
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 5690
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 5690

  - it: takes probe paths and timings from values
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness:
        path: /custom/healthz
        initialDelaySeconds: 1
        periodSeconds: 2
        timeoutSeconds: 3
        failureThreshold: 4
      probes.worker.readiness:
        path: /custom/healthz/readiness
        initialDelaySeconds: 5
        periodSeconds: 6
        timeoutSeconds: 7
        failureThreshold: 8
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe
          value:
            httpGet:
              path: /custom/healthz
              port: 5678
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 4
      - equal:
          path: spec.template.spec.containers[0].readinessProbe
          value:
            httpGet:
              path: /custom/healthz/readiness
              port: 5678
            initialDelaySeconds: 5
            periodSeconds: 6
            timeoutSeconds: 7
            failureThreshold: 8

  - it: takes the startup probe path and budget from values
    template: templates/deployment-worker.yaml
    set:
      probes.worker.startup:
        path: /custom/healthz
        periodSeconds: 5
        failureThreshold: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            httpGet:
              path: /custom/healthz
              port: 5678
            failureThreshold: 60
            periodSeconds: 5

  - it: drops the startup probe when it is disabled
    template: templates/deployment-worker.yaml
    set:
      probes.worker.startup.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet

  - it: drops a probe that is disabled
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.enabled: false
      probes.worker.readiness.enabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: runs a command as an exec probe
    template: templates/deployment-worker.yaml
    set:
      probes.worker.liveness.command: ["/bin/true"]
      probes.worker.readiness.command: ["/bin/false"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/true"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/false"]
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
      - exists:
          path: spec.template.spec.containers[0].startupProbe

  - it: runs a command as an exec probe with the health endpoint off
    template: templates/deployment-worker.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness.command: ["/bin/true"]
      probes.worker.readiness.command: ["/bin/false"]
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["/bin/true"]
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["/bin/false"]

  - it: leaves the health env out of the worker ConfigMap when the endpoint is off
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n-worker
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness.enabled: false
      probes.worker.readiness.enabled: false
    asserts:
      - notExists:
          path: data.QUEUE_HEALTH_CHECK_ACTIVE

  - it: rejects a liveness probe with nothing to check
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.readiness.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.liveness has nothing to check. redis.healthCheck.enabled=false turns off the worker health endpoint, and probes.worker.liveness.command is empty. Set redis.healthCheck.enabled=true, set probes.worker.liveness.command, or set probes.worker.liveness.enabled=false.'

  - it: rejects a readiness probe with nothing to check
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.readiness has nothing to check. redis.healthCheck.enabled=false turns off the worker health endpoint, and probes.worker.readiness.command is empty. Set redis.healthCheck.enabled=true, set probes.worker.readiness.command, or set probes.worker.readiness.enabled=false.'

  - it: accepts the health endpoint off when every probe has a command or is disabled
    template: templates/deployment-main.yaml
    set:
      redis.healthCheck.enabled: false
      probes.worker.liveness.command: ["/bin/true"]
      probes.worker.readiness.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: skips the probe checks when there are no worker pods
    template: templates/deployment-main.yaml
    set:
      queueMode.workerReplicaCount: 0
      redis.healthCheck.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: names the replacement for probes.worker.liveness.type
    template: templates/deployment-main.yaml
    set:
      probes.worker.liveness.type: httpGet
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.liveness.type is no longer a chart value. Remove it. Set probes.worker.liveness.command for an exec probe, or leave command empty to probe the health endpoint. See https://github.com/n8n-io/n8n-hosting/blob/main/charts/n8n/UPGRADING.md'

  - it: names the replacement for probes.worker.readiness.type
    template: templates/deployment-main.yaml
    set:
      probes.worker.readiness.type: exec
    asserts:
      - failedTemplate:
          errorMessage: 'probes.worker.readiness.type is no longer a chart value. Remove it. Set probes.worker.readiness.command for an exec probe, or leave command empty to probe the health endpoint. See https://github.com/n8n-io/n8n-hosting/blob/main/charts/n8n/UPGRADING.md'

  - it: rejects the worker probes from a 1.16 values file
    template: templates/deployment-main.yaml
    values:
      - values/chart-1.16-worker-probes.yaml
    asserts:
      - failedTemplate:
          errorMessage: |-
            - probes.worker.liveness.type is no longer a chart value. Remove it. Set probes.worker.liveness.command for an exec probe, or leave command empty to probe the health endpoint. See https://github.com/n8n-io/n8n-hosting/blob/main/charts/n8n/UPGRADING.md
            - probes.worker.readiness.type is no longer a chart value. Remove it. Set probes.worker.readiness.command for an exec probe, or leave command empty to probe the health endpoint. See https://github.com/n8n-io/n8n-hosting/blob/main/charts/n8n/UPGRADING.md
