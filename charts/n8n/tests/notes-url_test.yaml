# NOTES.txt prints the editor URL the chart sets as N8N_EDITOR_BASE_URL, so
# the install output and n8n agree on where the instance lives.
suite: 'notes: URL'
templates:
  - templates/NOTES.txt
set:
  secretRefs.existingSecret: n8n-core-secrets
  ingress.enabled: true
  ingress.hosts:
    - host: n8n.example.com
      paths:
        - path: /
          pathType: Prefix
tests:
  - it: prints the https URL with ingress TLS
    set:
      ingress.tls:
        - secretName: n8n-tls
          hosts:
            - n8n.example.com
    asserts:
      - matchRegexRaw:
          pattern: 'available at:\n  https://n8n\.example\.com\n'

  - it: prints the https URL the chart sets without ingress TLS
    asserts:
      - matchRegexRaw:
          pattern: 'available at:\n  https://n8n\.example\.com\n'
      - notMatchRegexRaw:
          pattern: 'http://n8n\.example\.com'

  - it: prints editor.url when it is set
    set:
      editor.url: http://n8n.internal
    asserts:
      - matchRegexRaw:
          pattern: 'available at:\n  http://n8n\.internal\n'

  - it: prints port-forward steps when only webhook.url is set
    set:
      ingress.enabled: false
      webhook.url: https://hooks.example.com
    asserts:
      - notMatchRegexRaw:
          pattern: 'available at:\n  https://hooks\.example\.com'
      - matchRegexRaw:
          pattern: 'kubectl port-forward service/RELEASE-NAME-n8n-main'
      - matchRegexRaw:
          pattern: 'WARNING: No editor URL is set, so n8n builds its editor and OAuth callback'

  - it: prints port-forward steps and a localhost warning when no public URL is set
    set:
      ingress.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: 'kubectl port-forward service/RELEASE-NAME-n8n-main'
      - notMatchRegexRaw:
          pattern: 'available at:'
      - matchRegexRaw:
          pattern: 'WARNING: No editor URL is set, so n8n builds its editor, webhook and OAuth'

  - it: names webhooks in the warning when webhook.enabled is false
    set:
      ingress.enabled: false
      webhook.enabled: false
      webhook.url: https://hooks.example.com
    asserts:
      - matchRegexRaw:
          pattern: 'builds its editor, webhook and OAuth'

  - it: leaves webhooks out of the warning when env.shared sets N8N_WEBHOOK_URL
    set:
      ingress.enabled: false
      env.shared.N8N_WEBHOOK_URL: https://hooks.example.com
    asserts:
      - matchRegexRaw:
          pattern: 'builds its editor and OAuth callback'

  - it: leaves out the localhost warning when a public URL is set
    asserts:
      - notMatchRegexRaw:
          pattern: 'No editor URL is set'

  - it: leaves out the localhost warning when env.shared sets N8N_HOST
    set:
      ingress.enabled: false
      env.shared.N8N_HOST: n8n.example.com
    asserts:
      - notMatchRegexRaw:
          pattern: 'No editor URL is set'

  - it: leaves out the localhost warning when env.main sets N8N_EDITOR_BASE_URL
    set:
      ingress.enabled: false
      env.main.N8N_EDITOR_BASE_URL: https://n8n.example.com
    asserts:
      - notMatchRegexRaw:
          pattern: 'No editor URL is set'

  - it: says the warning may not apply when envFrom loads extra sources
    set:
      ingress.enabled: false
      envFrom.main:
        - secretRef:
            name: n8n-urls
    asserts:
      - matchRegexRaw:
          pattern: 'No editor URL is set'
      - matchRegexRaw:
          pattern: 'cannot see inside envFrom sources'

  - it: leaves out the envFrom note when no envFrom sources are loaded
    set:
      ingress.enabled: false
    asserts:
      - notMatchRegexRaw:
          pattern: 'envFrom'
