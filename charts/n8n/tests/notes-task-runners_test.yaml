# NOTES.txt says where the sidecar runs and where its token comes from, so an
# install shows the cost of the default and the token source it used.
suite: 'notes: task runners'
templates:
  - templates/NOTES.txt
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: names the token Secret and the worker sidecar in queue mode
    set:
      taskRunners.authToken.existingSecret: n8n-runner-token
    asserts:
      - matchRegexRaw:
          pattern: '- Task runners: sidecar on worker pods, token from Secret n8n-runner-token\n'

  - it: names the main pod sidecar in standalone mode
    set:
      queueMode.enabled: false
      taskRunners.authToken.existingSecret: n8n-runner-token
    asserts:
      - matchRegexRaw:
          pattern: '- Task runners: sidecar on the main pod, token from Secret n8n-runner-token\n'

  - it: names authToken.value as the token source
    set:
      taskRunners.authToken.value: test-token
    asserts:
      - matchRegexRaw:
          pattern: 'token from taskRunners\.authToken\.value\n'

  - it: names the chart as the token source with authToken.generate
    set:
      taskRunners.authToken.generate: true
    asserts:
      - matchRegexRaw:
          pattern: 'token generated by the chart\n'

  - it: says code runs in the n8n process with task runners disabled
    set:
      taskRunners.enabled: false
    asserts:
      - matchRegexRaw:
          pattern: '- Task runners: off \(code runs inside the n8n process\)\n'
