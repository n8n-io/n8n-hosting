# OpenShift on 1.x: the restricted SCC assigns the UID and GID.
podSecurityContext:
  main:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: null
    runAsUser: null
    runAsGroup: null
  worker:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
    fsGroup: null
    runAsUser: null
    runAsGroup: null
secretRefs:
  env:
    N8N_RUNNERS_AUTH_TOKEN: example-token
