# SSL settings the chart reads from values and from a Secret. The CA ref
# matches the chart's, and the key ref names a different Secret.
database:
  type: postgresdb
  host: postgres.acme.internal
  passwordSecret:
    name: pg
    key: password
  ssl:
    enabled: true
    rejectUnauthorized: false
    existingSecret:
      name: pg-tls
      caKey: ca.crt
      certKey: tls.crt
      keyKey: tls.key

taskRunners:
  enabled: false
chartEnvOverrides:
  shared:
    DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"
