suite: 'validate: encryption key'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts with an inline encryption key
    template: templates/deployment-main.yaml
    set:
      secretRefs.existingSecret: ""
      secretRefs.env.N8N_ENCRYPTION_KEY: a-long-random-key-for-tests
    asserts:
      - notFailedTemplate: {}

  - it: rejects the placeholder encryption key
    template: templates/deployment-main.yaml
    set:
      secretRefs.existingSecret: ""
    asserts:
      - failedTemplate:
          errorMessage: 'secretRefs.env.N8N_ENCRYPTION_KEY must be changed from the default placeholder value, provide secretRefs.existingSecret with your own Secret, or set secretRefs.env.N8N_ENCRYPTION_KEY_FILE'

  - it: accepts the placeholder key with a key file
    template: templates/deployment-main.yaml
    set:
      secretRefs.existingSecret: ""
      secretRefs.env.N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n/encryption-key
    asserts:
      - notFailedTemplate: {}

  - it: rejects a relative key file path in the schema
    template: templates/deployment-main.yaml
    set:
      secretRefs.env.N8N_ENCRYPTION_KEY_FILE: secrets/encryption-key
    asserts:
      - failedTemplate:
          errorPattern: 'N8N_ENCRYPTION_KEY_FILE.*does not match pattern'
