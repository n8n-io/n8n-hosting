# The ServiceAccount names no cloud. Workload identity, such as EKS IRSA,
# arrives through serviceAccount.annotations.
suite: 'serviceaccount'
templates:
  - templates/serviceaccount.yaml
  - templates/configmap.yaml
  - templates/deployment-main.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: renders no annotations by default
    template: templates/serviceaccount.yaml
    asserts:
      - notExists:
          path: metadata.annotations

  - it: renders no annotations with S3 on the credential chain
    template: templates/serviceaccount.yaml
    set:
      license.enabled: true
      s3.enabled: true
      s3.bucket.name: n8n-data
      s3.bucket.region: eu-west-1
      s3.auth.autoDetect: true
    asserts:
      - notExists:
          path: metadata.annotations

  - it: passes serviceAccount.annotations through
    template: templates/serviceaccount.yaml
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - equal:
          path: metadata.annotations
          value:
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/n8n

  - it: names the replacement for serviceAccount.awsRoleArn
    template: templates/deployment-main.yaml
    set:
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - failedTemplate:
          errorMessage: 'serviceAccount.awsRoleArn is no longer a chart value. Set the role in serviceAccount.annotations as eks.amazonaws.com/role-arn instead. See https://github.com/n8n-io/n8n-hosting/blob/main/charts/n8n/UPGRADING.md'
