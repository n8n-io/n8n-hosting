suite: 'validate: queue mode'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
tests:
  - it: accepts the default queue mode shape
    template: templates/deployment-main.yaml
    asserts:
      - notFailedTemplate: {}

  - it: rejects queue mode without an external database
    template: templates/deployment-main.yaml
    set:
      database.useExternal: false
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/queueMode/enabled': value must be false"

  - it: requires database.host
    template: templates/deployment-main.yaml
    set:
      database.host: ""
    asserts:
      - failedTemplate:
          errorMessage: 'database.host is required when queueMode.enabled=true. Set it to your PostgreSQL hostname.'

  - it: requires redis.enabled
    template: templates/deployment-main.yaml
    set:
      redis.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'redis.enabled must be true when queueMode.enabled=true. Queue mode requires Redis.'

  - it: rejects an empty redis.host
    template: templates/deployment-main.yaml
    set:
      redis.host: ""
    asserts:
      # The schema catches this first; without-schema/ covers the fail.
      - failedTemplate:
          errorPattern: "at '/redis/host': minLength"

  - it: rejects a filesystem binary data mode in config.extraEnv
    template: templates/deployment-main.yaml
    set:
      config.extraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: filesystem
    asserts:
      - failedTemplate:
          errorMessage: 'config.extraEnv sets N8N_DEFAULT_BINARY_DATA_MODE=filesystem, but queueMode.enabled=true. Worker pods do not share a filesystem, so binary data one pod writes cannot be read by another. Remove the variable to let n8n choose, set it to "database", or store binary data in S3 with s3.enabled=true.'

  - it: rejects a filesystem binary data mode in queueMode.workerExtraEnv
    template: templates/deployment-main.yaml
    set:
      queueMode.workerExtraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: filesystem
    asserts:
      - failedTemplate:
          errorMessage: 'queueMode.workerExtraEnv sets N8N_DEFAULT_BINARY_DATA_MODE=filesystem, but queueMode.enabled=true. Worker pods do not share a filesystem, so binary data one pod writes cannot be read by another. Remove the variable to let n8n choose, set it to "database", or store binary data in S3 with s3.enabled=true.'

  - it: accepts a database binary data mode
    template: templates/deployment-main.yaml
    set:
      config.extraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: database
    asserts:
      - notFailedTemplate: {}

  - it: rejects a filesystem binary data mode in any letter case
    template: templates/deployment-main.yaml
    set:
      executions.extraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: Filesystem
    asserts:
      - failedTemplate:
          errorMessage: 'executions.extraEnv sets N8N_DEFAULT_BINARY_DATA_MODE=filesystem, but queueMode.enabled=true. Worker pods do not share a filesystem, so binary data one pod writes cannot be read by another. Remove the variable to let n8n choose, set it to "database", or store binary data in S3 with s3.enabled=true.'
