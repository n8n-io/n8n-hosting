suite: 'validate: S3'
templates:
  - templates/deployment-main.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  secretRefs.existingSecret: n8n-core-secrets
  s3.enabled: true
  s3.bucket.name: n8n-data
  s3.bucket.region: eu-west-1
tests:
  - it: accepts S3 with an access key
    template: templates/deployment-main.yaml
    set:
      s3.auth.accessKeyId: AKIAEXAMPLE
      s3.auth.secretAccessKeySecret.name: n8n-s3
      s3.auth.secretAccessKeySecret.key: secret-access-key
    asserts:
      - notFailedTemplate: {}

  - it: accepts S3 with IRSA
    template: templates/deployment-main.yaml
    set:
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - notFailedTemplate: {}

  - it: requires s3.bucket.name
    template: templates/deployment-main.yaml
    set:
      s3.bucket.name: ""
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - failedTemplate:
          errorMessage: 's3.bucket.name is required when s3.enabled=true'

  - it: requires s3.bucket.region
    template: templates/deployment-main.yaml
    set:
      s3.bucket.region: ""
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - failedTemplate:
          errorMessage: 's3.bucket.region is required when s3.enabled=true'

  - it: requires an access key when autoDetect is off
    template: templates/deployment-main.yaml
    asserts:
      - failedTemplate:
          errorMessage: 's3.auth.accessKeyId is required when s3.enabled=true and s3.auth.autoDetect=false'

  - it: requires serviceAccount.awsRoleArn when autoDetect is on
    template: templates/deployment-main.yaml
    set:
      s3.auth.autoDetect: true
    asserts:
      - failedTemplate:
          errorMessage: 'serviceAccount.awsRoleArn is required when s3.auth.autoDetect=true (for IRSA)'

  - it: rejects a filesystem mode with S3 on
    template: templates/deployment-main.yaml
    set:
      s3.storage.mode: filesystem
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
    asserts:
      - failedTemplate:
          errorMessage: 's3.storage.mode is "filesystem" but s3.enabled=true, so binary data is written to each pod''s local disk and not to S3. Set s3.storage.mode to "s3", or remove it to follow s3.enabled. S3 binary data storage requires an n8n Business or Enterprise licence.'

  # extraEnv renders after the chart's own variable, so it can keep S3 for
  # execution data and put binary data somewhere else.
  - it: accepts a binary data mode in extraEnv with S3 on
    template: templates/deployment-main.yaml
    set:
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
      config.extraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: database
    asserts:
      - notFailedTemplate: {}

  - it: rejects a filesystem binary data mode in extraEnv with S3 on in queue mode
    template: templates/deployment-main.yaml
    set:
      s3.auth.autoDetect: true
      serviceAccount.awsRoleArn: arn:aws:iam::123456789012:role/n8n
      config.extraEnv:
        - name: N8N_DEFAULT_BINARY_DATA_MODE
          value: filesystem
    asserts:
      - failedTemplate:
          errorMessage: 'config.extraEnv sets N8N_DEFAULT_BINARY_DATA_MODE=filesystem, but queueMode.enabled=true. Worker pods do not share a filesystem, so binary data one pod writes cannot be read by another. Remove the variable to let n8n choose, set it to "database", or remove it to store binary data in S3.'
