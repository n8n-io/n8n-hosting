suite: 'render: encryption key file'
templates:
  - templates/deployment-main.yaml
  - templates/deployment-worker.yaml
  - templates/deployment-webhook-processor.yaml
  - templates/configmap.yaml
  - templates/secrets.yaml
set:
  webhookProcessor.enabled: true
  secretRefs.env.N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n/encryption-key
  taskRunners.authToken.existingSecret: n8n-runner-token
tests:
  - it: passes the key file path in the shared ConfigMap
    template: templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-n8n
    asserts:
      - equal:
          path: data.N8N_ENCRYPTION_KEY_FILE
          value: /run/secrets/n8n/encryption-key

  - it: reads no key from a Secret on any n8n container
    templates:
      - templates/deployment-main.yaml
      - templates/deployment-worker.yaml
      - templates/deployment-webhook-processor.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: RELEASE-NAME-n8n
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: N8N_ENCRYPTION_KEY
          any: true

  - it: renders no chart-managed Secret
    template: templates/secrets.yaml
    asserts:
      - hasDocuments:
          count: 0
