{{- /* In file mode no container reads N8N_ENCRYPTION_KEY, so there is nothing to store. */}}
{{- if not (or .Values.secretRefs.existingSecret .Values.secretRefs.env.N8N_ENCRYPTION_KEY_FILE) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  N8N_ENCRYPTION_KEY: {{ .Values.secretRefs.env.N8N_ENCRYPTION_KEY | quote }}
{{- end }}
