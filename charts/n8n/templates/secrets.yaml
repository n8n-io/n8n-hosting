{{- if not .Values.secretRefs.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
{{- /* N8N_ENCRYPTION_KEY_FILE is a path the pods receive directly, and in file mode no container reads N8N_ENCRYPTION_KEY. */}}
{{- $env := omit .Values.secretRefs.env "N8N_ENCRYPTION_KEY_FILE" }}
{{- if .Values.secretRefs.env.N8N_ENCRYPTION_KEY_FILE }}
{{- $env = omit $env "N8N_ENCRYPTION_KEY" }}
{{- end }}
{{- range $k, $v := $env }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
