{{- /* The chart's Secret holds the secrets supplied in values, and renders only
when one is set. In file mode no container reads N8N_ENCRYPTION_KEY. */}}
{{- $encryptionKey := not (or .Values.secretRefs.existingSecret .Values.secretRefs.env.N8N_ENCRYPTION_KEY_FILE) }}
{{- $licenseKey := and .Values.license.enabled .Values.license.activationKey }}
{{- if or $encryptionKey $licenseKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "n8n.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if $encryptionKey }}
  N8N_ENCRYPTION_KEY: {{ .Values.secretRefs.env.N8N_ENCRYPTION_KEY | quote }}
  {{- end }}
  {{- if $licenseKey }}
  N8N_LICENSE_ACTIVATION_KEY: {{ .Values.license.activationKey | quote }}
  {{- end }}
{{- end }}
