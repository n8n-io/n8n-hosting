{{- /* A budget over a single main pod forbids every eviction and hangs node drains, so render only when a second main pod exists. */}}
{{- $mainReplicas := include "n8n.mainReplicas" . | int }}
{{- $hpaMinReplicas := ternary .Values.hpa.main.minReplicas 0 .Values.hpa.main.enabled | int }}
{{- if and .Values.pdb.enabled (or (gt $mainReplicas 1) (gt $hpaMinReplicas 1)) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "n8n.fullname" . }}-main
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "n8n.name" . }}
      app.kubernetes.io/component: main
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
