{{- $hooks := .Values.ingress.webhook | default dict }}
{{- if and .Values.ingress.enabled (or .Values.webhookProcessor.enabled $hooks.hosts) }}
{{- $fullname := include "n8n.fullname" . }}
{{- $backend := ternary (printf "%s-webhook-processor" $fullname) (printf "%s-main" $fullname) (and .Values.webhookProcessor.enabled true) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- /* The name stays the same in every layout. ingress-nginx refuses an
  Ingress for paths another Ingress holds, so a new name fails the upgrade. */}}
  name: {{ $fullname }}-webhook-processor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-processor
  {{- with merge (deepCopy ($hooks.annotations | default dict)) (.Values.commonAnnotations | default dict) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $hooks.className | default .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  {{- if $hooks.hosts }}
  {{- /* Webhook hosts carry the webhook paths only, so the editor is not
  reachable there. n8n builds test URLs from the webhook URL too, and only
  main serves them. */}}
  {{- range $hooks.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
        {{- range include "n8n.webhookPaths" $ | fromYamlArray }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  number: {{ $.Values.service.port }}
        {{- end }}
        {{- range include "n8n.webhookTestPaths" $ | fromYamlArray }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-main
                port:
                  number: {{ $.Values.service.port }}
        {{- end }}
  {{- end }}
  {{- else }}
  {{- /* Webhooks share the editor hosts. The main Ingress sends the rest of
  each host to main. */}}
  {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
        {{- range include "n8n.webhookPaths" $ | fromYamlArray }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $backend }}
                port:
                  number: {{ $.Values.service.port }}
        {{- end }}
  {{- end }}
  {{- end }}
  {{- with $hooks.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
