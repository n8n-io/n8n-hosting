{{- if and .Values.queueMode.enabled (gt (int .Values.queueMode.workerReplicaCount) 0) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not (include "n8n.autoscalerOwnsReplicas" (dict "root" . "component" "worker")) }}
  replicas: {{ .Values.queueMode.workerReplicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "n8n.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      {{- $podAnns := merge (dict "checksum/config" (include "n8n.envChecksum" (dict "root" $ "component" "worker")) "checksum/secret" (include (print $.Template.BasePath "/secrets.yaml") . | sha256sum)) (.Values.podAnnotations | default dict) (.Values.commonAnnotations | default dict) }}
      annotations:
        {{- toYaml $podAnns | nindent 8 }}
      labels:
        {{- include "n8n.podLabels" (dict "root" . "component" "worker") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "n8n.serviceAccountName" . }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- if hasKey .Values.serviceAccount "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- end }}

      {{- with include "n8n.podSecurityContext" (dict "root" $ "role" "worker") }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}

      {{- with .Values.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.lifecycle.worker.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}

      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}

      containers:
        - name: n8n-worker
          image: {{ include "n8n.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "worker"
            {{- with .Values.queueMode.workerConcurrency }}
            - "--concurrency={{ . }}"
            {{- end }}
          {{- with include "n8n.containerSecurityContext" (dict "root" $ "role" "worker") }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}

          {{- if .Values.lifecycle.worker.preStop.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  {{- toYaml .Values.lifecycle.worker.preStop.command | nindent 18 }}
          {{- end }}

          {{- include "n8n.containerEnv" (dict "root" $ "component" "worker") | trim | nindent 10 }}

          # Worker Health Probes
          {{- with .Values.probes.worker.startup }}
          {{- if and .enabled $.Values.redis.healthCheck.enabled }}
          startupProbe:
            httpGet:
              path: {{ .path }}
              port: {{ $.Values.redis.healthCheck.port }}
            failureThreshold: {{ .failureThreshold }}
            periodSeconds: {{ .periodSeconds }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.worker.readiness }}
          {{- if .enabled }}
          readinessProbe:
            {{- include "n8n.workerProbeHandler" (dict "probe" . "root" $) | nindent 12 }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          {{- with .Values.probes.worker.liveness }}
          {{- if .enabled }}
          livenessProbe:
            {{- include "n8n.workerProbeHandler" (dict "probe" . "root" $) | nindent 12 }}
            initialDelaySeconds: {{ .initialDelaySeconds }}
            periodSeconds: {{ .periodSeconds }}
            timeoutSeconds: {{ .timeoutSeconds }}
            failureThreshold: {{ .failureThreshold }}
          {{- end }}
          {{- end }}

          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}

          # Volume mounts for external volumes
          volumeMounts:
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

        {{- if .Values.taskRunners.enabled }}
        # Task Runner sidecar container
        {{- include "n8n.taskRunnerContainer" . | nindent 8 }}
        {{- end }}

        {{- with .Values.extraContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}

      # External volumes
      volumes:
        {{- if and .Values.taskRunners.enabled .Values.taskRunners.customConfig.enabled }}
        - name: task-runner-config
          configMap:
            name: {{ .Values.taskRunners.customConfig.configMapName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      {{- $nodePlacement := .Values.nodePlacement | default dict }}
      {{- $componentPlacement := $nodePlacement.worker | default dict }}
      {{- if $componentPlacement.nodeSelector }}
      nodeSelector: {{- toYaml $componentPlacement.nodeSelector | nindent 8 }}
      {{- else if .Values.nodeSelector }}
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if $componentPlacement.tolerations }}
      tolerations: {{- toYaml $componentPlacement.tolerations | nindent 8 }}
      {{- else if .Values.tolerations }}
      tolerations: {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if $componentPlacement.affinity }}
      affinity: {{- toYaml $componentPlacement.affinity | nindent 8 }}
      {{- else if .Values.affinity }}
      affinity: {{- toYaml .Values.affinity | nindent 8 }}
      {{- end }}
{{- end }}
