# Overlay for installing examples/gateway-httproute.yaml on kind. It replaces
# the placeholders with the fixtures in ../fixtures/ and scales the example
# down to fit a hosted runner. The parentRefs and hostname stay as they are;
# gateway-httproute.pre.sh creates a Gateway by that name.
queueMode:
  workerReplicaCount: 1
webhookProcessor:
  replicaCount: 1
database:
  host: postgres
redis:
  host: redis
