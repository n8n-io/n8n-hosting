# CI overlay: merged with examples/minimal.yaml in .github/workflows/ci.yml
# to ensure queueMode.workerGroups renders on every PR.
#
# Covers all three shapes: a KEDA-scaled group pinned to a worker pool, a group
# with KEDA disabled that keeps a static replicaCount, and a poolless group with
# KEDA left on, which must NOT get a scaler of its own because the default
# worker's ScaledObject already watches the queue it shares.
#
# The pooled group also carries an authenticationRef, whose shape must stay the
# object the release-level keda.worker.triggers[] uses; a regression to a bare
# string fails the values schema and so fails this render.
keda:
  enabled: true

queueMode:
  enabled: true
  workerGroups:
    - name: ci-pooled
      poolName: ci-pooled
      concurrency: 5
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      keda:
        minReplicaCount: 1
        maxReplicaCount: 3
        jobsPerReplica: 5
        authenticationRef:
          name: ci-redis-auth
    - name: ci-static
      replicaCount: 1
      extraEnv:
        - name: N8N_LOG_LEVEL
          value: debug
      keda:
        enabled: false
    - name: ci-poolless
      replicaCount: 1

config:
  extraEnv:
    - name: N8N_WORKER_POOLS_ENABLED
      value: "true"
