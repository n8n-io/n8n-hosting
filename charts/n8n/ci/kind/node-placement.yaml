# One node per pool in examples/node-placement.yaml. The workers node carries
# the taint the example's worker toleration expects.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      pool: n8n-frontend
  - role: worker
    labels:
      pool: n8n-workers
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: dedicated
              value: n8n-workers
              effect: NoSchedule
