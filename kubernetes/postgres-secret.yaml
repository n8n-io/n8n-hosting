apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_USER: changeUser
  POSTGRES_PASSWORD: changePassword
  POSTGRES_DB: n8n
  POSTGRES_NON_ROOT_USER: changeNonRootUser
  POSTGRES_NON_ROOT_PASSWORD: changeNonRootPassword