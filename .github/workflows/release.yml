name: Release

# main releases the current chart major. chart-v2 is where the next major is
# built, and releases 2.0.0-rc.N pre-releases from its own config and manifest
# so the two lines never share a version.
on:
  push:
    branches: [main, chart-v2]
    paths:
      - "charts/**"
      - "release-please-config*.json"
      - ".release-please-manifest*.json"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  packages: write
  pull-requests: write

# One group per branch. A group keeps a single pending run and cancels the one
# it replaces, so a shared group would let a chart-v2 push cancel a main
# release that was waiting its turn.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Mapped here because the `secrets` context is not available to a step's
      # `if`, and the step below has to be able to tell whether the App exists.
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      # A PR opened under GITHUB_TOKEN gets no pull_request event, so
      # release-please's PRs get no CI at all: #182 sat for weeks with zero
      # checks. Opening them as the App fixes that, and it is what lets
      # ci.yml's gate run install-test on a release-please-- branch.
      #
      # Skipped while the App's secrets are absent, with release-please falling
      # back to GITHUB_TOKEN, so releases keep working exactly as they do now
      # and switch over on their own once the secrets land.
      - name: Mint bot token
        id: app-token
        if: env.RELEASE_APP_ID != ''
        # SHA pinned because this one is handed a private key.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: ${{ github.ref_name == 'chart-v2' && 'release-please-config.chart-v2.json' || 'release-please-config.json' }}
          manifest-file: ${{ github.ref_name == 'chart-v2' && '.release-please-manifest.chart-v2.json' || '.release-please-manifest.json' }}

      # release-please prefixes its outputs with the package path from
      # release-please-config.json, so these are charts/n8n--*.
      - uses: azure/setup-helm@v4
        if: steps.release.outputs['charts/n8n--release_created'] == 'true'
        with:
          version: "3.17.0"

      - uses: actions/checkout@v4
        if: steps.release.outputs['charts/n8n--release_created'] == 'true'

      - name: Log in to GHCR
        if: steps.release.outputs['charts/n8n--release_created'] == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push to GHCR
        if: steps.release.outputs['charts/n8n--release_created'] == 'true'
        env:
          CHART_VERSION: ${{ steps.release.outputs['charts/n8n--version'] }}
        run: |
          helm package charts/n8n --destination /tmp/chart-pkg/
          helm push "/tmp/chart-pkg/n8n-${CHART_VERSION}.tgz" oci://ghcr.io/n8n-io/n8n-helm-chart
